<!DOCTYPE html>
<html lang="en">
<head>
    <title>Secretariat Dashboard - Syntaxis</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="./style.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gradient-to-r from-gray-300 via-gray-100 to-white text-gray-800">
    <nav class="w-full bg-yellow-800 bg-opacity-90 text-white rounded-md flex items-center p-2">
        <div class="flex items-center">
            <img src="icons/logo.png" alt="Syntaxis Logo" class="w-12 h-12 rounded-full border-4 border-white shadow-lg">
            <span class="ml-2 text-xl font-bold">Syntaxis</span>
        </div>
        <div class="flex flex-row ml-auto space-x-4">
                <a href="secretariat.html" class="text-lg flex items-center gap-2 font-semibold py-2 px-4 rounded transform transition-transform duration-300 hover:scale-105">
                    <img src="icons/dashboard.png" class="w-6 h-6 rounded-md"> Dashboard
                </a>
                <a href="javascript:void(0);" onclick="importJSON()" class="text-lg flex gap-2 font-semibold py-2 px-4 rounded transform transition-transform duration-300 hover:scale-110">
                    <i class="fa-solid fa-file-export" style="color: #FFD43B;"></i> Upload JSON
                </a>
                <a href="./php/logout.php" class="text-lg flex items-center gap-2 font-semibold py-2 px-4 rounded hover:bg-yellow-700">
                    <img src="icons/logout.png" class="w-6 h-6 rounded-md">Logout
                </a>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="flex-1 p-6">
        <!-- Header Section -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-yellow-700">Welcome to the Secretariat Dashboard</h1>
        </header>
        
        <!-- Dashboard Cards -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Total Students Card -->
            <div class="bg-white p-6 rounded-lg shadow-lg transform transition duration-300 hover:shadow-2xl">
                <h2 class="text-xl font-bold text-yellow-700 mb-4">Total Students Registered</h2>
                <p id="totalStudents" class="text-3xl font-bold text-gray-800">0</p>
                <p class="text-gray-600 mt-2">Students currently registered to the system</p>
            </div>
            
            <!-- Active Tutors Card -->
            <div class="bg-white p-6 rounded-lg shadow-lg transform transition duration-300 hover:shadow-2xl">
                <h3 class="text-xl font-bold text-yellow-700 mb-4">Active Tutors</h3>
                <div id="activeTutors" class="tutors-list"></div>
                <p class="text-gray-600 mt-2">Tutors supervising</p>
            </div>
            
            <!-- Courses Offered Card -->
            <div class="bg-white p-6 rounded-lg shadow-lg transform transition duration-300 hover:shadow-2xl">
                <h3 class="text-xl font-bold text-yellow-700 mb-4">Theses</h3>
                <div id="activeTheses" class="theses-list"></div>
                <p class="text-gray-600 mt-2">Theses</p>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-lg transform transition duration-300 hover:shadow-2xl h-96 overflow-y-auto">
                <div class="flex items-center mb-4">
                    <img src="icons/secretary.png" class="w-6 h-6 rounded-md mr-2 transform transition-transform duration-300 hover:scale-150">
                    <h3 class="text-xl font-bold text-yellow-700">Management</h3>
                </div>
                <div id="thesesManagementContainer"></div>
            </div>
            

            <div class="bg-white p-6 rounded-lg shadow-lg transform transition duration-300 h-96 hover:shadow-2xl overflow-y-auto">
                <h3 class="text-xl font-bold text-yellow-700 mb-4">Under Review and in Progress Theses</h3>
                <div id="thesesDetailsCard"></div>
            </div>

              <!-- Announcements Card -->
              <div class="bg-white p-6 rounded-lg shadow-lg transform transition duration-300 hover:shadow-2xl h-96">
                <h3 class="text-xl font-bold text-yellow-700 mb-4">Announcements</h3>
                <div id="announcementsList" class="announcements-list"></div>
                <p class="text-gray-600 mt-2">Recent announcements posted</p>
            </div>

            <!-- Thesis Details Modal -->
            <div id="thesisDetailsModal" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center hidden">
                <div class="bg-white p-6 rounded-lg shadow-lg max-w-lg w-full">
                    <div class="flex justify-between items-center mb-4">
                        <h2 id="modalTitle" class="text-2xl font-bold text-yellow-700"></h2>
                        <button onclick="closeModal()" class="text-gray-600 hover:text-gray-800"><i class="fa-solid fa-xmark transform transition-transform duration-300 hover:scale-150" style="color: #FFD43B;"></i></button>
                    </div>
                    <div id="modalContent" class="text-gray-800"></div>
                    
                </div>
            </div>

        

        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/secretariat.js"></script>
    <script src="./js/management.js"></script> 
</body>
</html>
