<!DOCTYPE html>
<html lang="en">
<head>
    <title>Settings - Syntaxis</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<style>
   /* Card styling with hover effect */
    .settings-card {
        background-color: white;
        max-width: 65%;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .settings-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }


    input[type="text"], input[type="email"] {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px;
        width: 100%;
        margin-top: 10px;
        color: #ca8a04; 
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]:focus, input[type="email"]:focus {
        outline: none;
        border-color: #d97706; /* yellow-600 */
        box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.5); /* yellow-600 ring */
        color: #d97706; /* yellow-600 */
    }

</style>
<body class="min-h-screen bg-gradient-to-r from-gray-300 via-gray-100 to-white text-gray-800">

    <!-- Horizontal Navbar -->
    <nav class="w-full bg-yellow-800 bg-opacity-90 text-white rounded-md flex items-center p-4 shadow-md">
        <div class="flex items-center">
            <img src="icons/logo.png" alt="Syntaxis Logo" class="w-12 h-12 rounded-full border-4 border-white shadow-lg">
            <span class="ml-3 text-xl font-bold">Syntaxis</span>
        </div>
        <div class="flex flex-row ml-auto space-x-6">
            <a href="student_dashboard.html" class="text-lg flex items-center gap-2 font-semibold py-2 px-4 rounded transform transition-transform duration-300 hover:scale-105">
                <img src="icons/dashboard.png" class="w-6 h-6 rounded-md"> Dashboard
            </a>
            <a href="presentation.html" class="text-lg flex items-center gap-2 font-semibold py-2 px-4 rounded transform transition-transform duration-300 hover:scale-105">
                <img src="icons/slideshow.png" class="w-6 h-6 rounded-md"> Presentation
            </a>
            <a href="./php/logout.php" class="text-lg flex items-center gap-2 font-semibold py-2 px-4 rounded hover:bg-yellow-700">
                <img src="icons/logout.png" class="w-6 h-6 rounded-md">Logout
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 p-6">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-yellow-700">Settings</h1>
        </header>

        <!-- Cards for Each Setting -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-8">

            <!-- Address Card -->
            <div class="settings-card" id="addressCard">
                <h2 class="text-xl font-bold flex gap-1 text-gray-700"> Full Postal Address <img src="icons/map.png" class="w-6 h-6 rounded-md transform transition-transform duration-300 hover:scale-110"></h2>
                <input type="text" id="address" class="w-full p-2 mt-2 border border-gray-300 rounded-md" />
                <button onclick="updateSetting('address')" class="bg-yellow-700 hover:bg-yellow-800 text-white font-bold py-2 px-4 mt-4 rounded-lg shadow-lg">Update</button>
            </div>

            <!-- Email Card -->
            <div class="settings-card" id="emailCard">
                <h2 class="text-xl font-bold flex gap-1 text-gray-700"> Email Address <img src="icons/mail.png" class="w-6 h-6 rounded-md transform transition-transform duration-300 hover:scale-110"></h2>
                <input type="email" id="email" class="w-full p-2 mt-2 border border-gray-300 rounded-md" />
                <button onclick="updateSetting('email')" class="bg-yellow-700 hover:bg-yellow-800 text-white font-bold py-2 px-4 mt-4 rounded-lg shadow-lg">Update</button>
            </div>

            <!-- Mobile Phone Card -->
            <div class="settings-card" id="mobileCard">
                <h2 class="text-xl font-bold flex gap-1 text-gray-700"> Mobile Phone <img src="icons/phone.png" class="w-6 h-6 rounded-md transform transition-transform duration-300 hover:scale-110"></h2>
                <input type="text" id="mobile" class="w-full p-2 mt-2 border border-gray-300 rounded-md" />
                <button onclick="updateSetting('mobile')" class="bg-yellow-700 hover:bg-yellow-800 text-white font-bold py-2 px-4 mt-4 rounded-lg shadow-lg">Update</button>
            </div>

            <!-- Landline Phone Card -->
            <div class="settings-card" id="phoneCard">
                <h2 class="text-xl font-bold flex gap-1 text-gray-700">Landline Phone <img src="icons/telephone.png" class="w-6 h-6 rounded-md transform transition-transform duration-300 hover:scale-110"></h2>
                <input type="text" id="phone" class="w-full p-2 mt-2 border border-gray-300 rounded-md" />
                <button onclick="updateSetting('phone')" class="bg-yellow-700 hover:bg-yellow-800 text-white font-bold py-2 px-4 mt-4 rounded-lg shadow-lg">Update</button>
            </div>
        </div>
    </main>

    <script src="./js/settings.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
