    <main class="flex-1 p-6">
        <!-- Header Section -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-yellow-700">Supervising</h1>
            <p class="text-l font-bold text-gray-700">Detailed view of completed and ongoing theses</p>
        </header>
        
        <!-- Filters -->
        <div class="flex items-center space-x-4 mb-6">
            <select id="statusFilter" class="p-2 border border-gray-300 rounded bg-gray-100 hover:bg-gray-200 transition-colors duration-200 font-semibold">
                <option value="">All Statuses</option>
                <option value="under assignment">Under Assignment</option>
                <option value="in progress">In Progress</option>
                <option value="under review">Under Review</option>
                <option value="completed">Completed</option>
            </select>
            <select id="roleFilter" class="p-2 border border-gray-300 rounded bg-gray-100 hover:bg-gray-200 transition-colors duration-200 font-semibold">
                <option value="">All Roles</option>
                <option value="supervisor">Supervisor</option>
                <option value="committee">Committee Member</option>
            </select>

            <button id="cTheses" class="p-2 border border-red-400 rounded-md py-1 px-3 rounded font-semibold mt-1 self-start">
                Cancelled theses
            </button>

            <!-- Export Buttons -->
            <div class="flex space-x-4 mb-6" id="exportButtons">
                <button id="exportToCSV" class="transform transition-transform duration-200 hover:scale-150 py-2 px-4 rounded">
                    <i class="fa-solid fa-file-csv fa-2xl" style="color: #FFD43B;"></i>
                </button>
                <button id="exportToJSON"  class="transform transition-transform duration-200 hover:scale-150 py-2 px-4 rounded">
                    <i class="fa-solid fa-file-export fa-2xl" style="color: #FFD43B;"></i>
                </button>
            </div>
        </div>
    
        <!-- Theses List -->
        <div id="thesisList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        

        <!-- Thesis Details Modal -->
        <div id="thesisModal2" class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-lg flex items-center justify-center hidden transition-colors duration-200 font-semibold">
            <div class="bg-white rounded-lg shadow-xl p-6 w-11/12 md:w-2/3 lg:w-1/2 max-h-[60vh] overflow-y-auto">
                <!-- Close Button -->
                <button id="closeModalBtn" class="float-right text-gray-500 hover:text-yellow-500 transform transition-transform duration-200 hover:scale-150">
                    <i class="fa-regular fa-rectangle-xmark"></i>
                </button>
                <!-- Modal Content -->
                <h2 id="modalTitle" class="text-3xl font-bold text-yellow-700 mb-4"></h2>
                <div id="modalContent" class="space-y-4 text-gray-800">
                    <!-- Content will be dynamically inserted here -->
                </div>
            </div>
        </div>
        <!-- Grading Modal -->
        <div id="gradingModal" class="fixed inset-0 hidden bg-gray-800 bg-opacity-70 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-lg shadow-lg w-96 font-semibold">
                <h2 class="text-2xl font-bold text-yellow-700 mb-6">Grade Thesis</h2>

                <div>
                    <label class="block text-gray-700 mb-1">1. Quality of Thesis and Goal Fulfillment (60%)</label>
                    <input type="number" min="0" max="10" id="criteria1" class="w-full p-2 border border-gray-300 rounded mb-4" placeholder="Enter grade (0-10)">
                </div>
                <div>
                    <label class="block text-gray-700 mb-1">2. Completion Time (15%)</label>
                    <input type="number" min="0" max="10" id="criteria2" class="w-full p-2 border border-gray-300 rounded mb-4" placeholder="Enter grade (0-10)">
                </div>
                <div>
                    <label class="block text-gray-700 mb-1">3. Quality and Completeness of the Text (15%)</label>
                    <input type="number" min="0" max="10" id="criteria3" class="w-full p-2 border border-gray-300 rounded mb-4" placeholder="Enter grade (0-10)">
                </div>
                <div>
                    <label class="block text-gray-700 mb-1">4. Overall Presentation (10%)</label>
                    <input type="number" min="0" max="10" id="criteria4" class="w-full p-2 border border-gray-300 rounded mb-4" placeholder="Enter grade (0-10)">
                </div>

                <div class="flex justify-end space-x-4 mt-6">
                    <button onclick="saveGrades()" class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded font-semibold">Save</button>
                    <button onclick="closeGradingModal()" class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-6 rounded font-semibold">Cancel</button>
                </div>
            </div>
        </div>



        <div id="cThesesModal" class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-lg flex items-center justify-center hidden transition-colors duration-200 font-semibold">
            <div class="bg-white rounded-lg shadow-xl p-6 w-11/12 md:w-2/3 lg:w-1/2 max-h-[60vh] overflow-y-auto">
